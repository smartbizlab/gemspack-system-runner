<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gems Pack — System Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --surface3: #252528;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8e6e0;
  --text2: #9e9b93;
  --text3: #5e5c57;
  --accent: #d4a84b;
  --accent2: #b8872e;
  --success: #4a9e6e;
  --success-bg: rgba(74,158,110,0.1);
  --warn: #c4813a;
  --warn-bg: rgba(196,129,58,0.1);
  --info: #5b8fd4;
  --info-bg: rgba(91,143,212,0.1);
  --font-display: 'DM Serif Display', serif;
  --font-body: 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --radius: 10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Layout ── */
.app-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ── Header ── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 24px;
  border-bottom: 0.5px solid var(--border);
  margin-bottom: 32px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 32px;
  height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.logo-name {
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--text);
  letter-spacing: -0.01em;
}
.logo-sub {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
}
.header-right {
  font-size: 12px;
  color: var(--text3);
}

/* ── Screen transitions ── */
.screen { display: none; animation: fadeIn 0.2s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── Selector screen ── */
.sel-intro { margin-bottom: 28px; }
.sel-intro h1 {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 8px;
}
.sel-intro p { color: var(--text2); font-size: 14px; }

.sys-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}

.sys-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.sys-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s ease;
}
.sys-card:hover { border-color: var(--border2); background: var(--surface2); transform: translateY(-1px); }
.sys-card:hover::before { transform: scaleX(1); }
.sys-card.has-progress::before { transform: scaleX(1); background: var(--success); }

.sys-num {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.sys-card.has-progress .sys-num { color: var(--success); }
.sys-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}
.sys-prob {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.45;
  margin-bottom: 10px;
}
.sys-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text3);
}
.sys-progress-bar {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 10px;
  overflow: hidden;
}
.sys-progress-fill {
  height: 100%;
  background: var(--success);
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* ── Runner screen ── */
.runner-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.runner-info h2 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 4px;
}
.runner-info p { font-size: 13px; color: var(--text2); }

.back-btn {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-size: 12px;
  font-family: var(--font-body);
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}
.back-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── Progress stepper ── */
.stepper {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 28px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.stepper::-webkit-scrollbar { display: none; }

.step-pip-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
}
.step-pip {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  font-family: var(--font-mono);
  color: var(--text3);
  transition: all 0.2s;
  position: relative;
  z-index: 1;
}
.step-pip-wrap.done .step-pip { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.step-pip-wrap.active .step-pip { background: var(--accent); border-color: var(--accent); color: #0e0e0f; font-weight: 700; }
.step-pip-wrap .step-gem-label {
  font-size: 9px;
  color: var(--text3);
  margin-top: 4px;
  white-space: nowrap;
  font-family: var(--font-mono);
  transition: color 0.2s;
}
.step-pip-wrap.active .step-gem-label { color: var(--accent); }
.step-pip-wrap.done .step-gem-label { color: var(--success); }

.step-connector {
  height: 1.5px;
  flex: 1;
  min-width: 12px;
  background: var(--border);
  margin-bottom: 18px;
  flex-shrink: 0;
}
.step-connector.done { background: var(--success); opacity: 0.5; }

/* ── Step card ── */
.step-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}

.step-header {
  padding: 18px 20px 16px;
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.gem-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  color: #0e0e0f;
  font-weight: 700;
  font-family: var(--font-mono);
}
.step-header-text { flex: 1; }
.step-gem-name {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 3px;
  font-family: var(--font-mono);
}
.step-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.step-desc { font-size: 13px; color: var(--text2); line-height: 1.5; }

.step-body { padding: 18px 20px; }

/* ── Section labels ── */
.sec-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sec-label::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 10px;
  background: var(--accent);
  border-radius: 2px;
  opacity: 0.6;
}

/* ── Inputs checklist ── */
.input-list { margin-bottom: 16px; }
.inp-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 0;
  cursor: pointer;
  border-bottom: 0.5px solid var(--border);
}
.inp-row:last-child { border-bottom: none; }
.inp-row:hover .inp-txt { color: var(--text); }

.chkbox {
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--text3);
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 10px;
}
.chkbox.on { background: var(--success); border-color: var(--success); color: #fff; }
.inp-txt { font-size: 13px; color: var(--text2); line-height: 1.5; transition: color 0.15s; }
.inp-txt.done { text-decoration: line-through; opacity: 0.4; }

/* ── Checkpoint ── */
.checkpoint {
  background: var(--warn-bg);
  border: 0.5px solid rgba(196,129,58,0.3);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--warn);
  line-height: 1.5;
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.checkpoint-icon { flex-shrink: 0; font-size: 13px; }

/* ── Prompt ── */
.prompt-wrap {
  position: relative;
  margin-bottom: 16px;
}
.prompt-box {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px 44px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text2);
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
}
.prompt-var { color: var(--accent); font-weight: 500; }
.copy-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: var(--surface3);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 12px;
  font-family: var(--font-body);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.copy-btn:hover { color: var(--text); border-color: var(--accent); }
.copy-btn.copied { color: var(--success); border-color: var(--success); }

/* ── Output note ── */
.output-note {
  background: var(--success-bg);
  border: 0.5px solid rgba(74,158,110,0.25);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  color: #7ec89d;
  line-height: 1.6;
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.output-note-icon { flex-shrink: 0; }

/* ── Output field ── */
.output-field-wrap { margin-top: 4px; }
.output-textarea {
  width: 100%;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  line-height: 1.7;
  resize: vertical;
  min-height: 90px;
  transition: border-color 0.15s;
  outline: none;
}
.output-textarea::placeholder { color: var(--text3); }
.output-textarea:focus { border-color: var(--border2); }
.output-textarea.has-content { border-color: rgba(74,158,110,0.35); }

.save-note {
  font-size: 11px;
  color: var(--text3);
  margin-top: 6px;
  font-family: var(--font-mono);
}

/* ── Nav ── */
.step-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 8px;
}
.nav-btn {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  font-size: 13px;
  font-family: var(--font-body);
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.nav-btn:hover:not(:disabled) { border-color: var(--border2); color: var(--text); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #0e0e0f;
  font-weight: 600;
}
.nav-btn.primary:hover:not(:disabled) { background: #e0b558; border-color: #e0b558; }
.step-counter {
  font-size: 12px;
  color: var(--text3);
  font-family: var(--font-mono);
  white-space: nowrap;
}

/* ── Complete card ── */
.complete-wrap {
  margin-top: 4px;
}
.complete-card {
  background: var(--success-bg);
  border: 0.5px solid rgba(74,158,110,0.3);
  border-radius: var(--radius);
  padding: 20px 24px;
  text-align: center;
  margin-bottom: 16px;
}
.complete-icon { font-size: 28px; margin-bottom: 8px; }
.complete-title {
  font-family: var(--font-display);
  font-size: 20px;
  color: #7ec89d;
  margin-bottom: 6px;
}
.complete-sub { font-size: 13px; color: var(--success); opacity: 0.8; line-height: 1.5; }

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.kpi-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.kpi-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
  font-family: var(--font-mono);
}
.kpi-content { font-size: 12px; color: var(--text2); line-height: 1.6; }

.restart-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  font-size: 13px;
  font-family: var(--font-body);
  color: var(--text2);
  cursor: pointer;
  margin: 0 auto;
  transition: all 0.15s;
}
.restart-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── Completion screen extras ── */
.completion-section { margin-top: 20px; }
.completion-section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 6px;
}
.completion-section-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 10px;
  background: var(--accent);
  border-radius: 2px;
  opacity: 0.6;
}

/* Export brief */
.export-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--surface2);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  padding: 14px 20px;
  font-size: 13px;
  font-family: var(--font-body);
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
}
.export-btn:hover { border-color: var(--accent); background: var(--surface3); }
.export-btn .export-icon { font-size: 16px; opacity: 0.7; }
.export-hint { font-size: 11px; color: var(--text3); text-align: center; font-family: var(--font-mono); }

/* Related systems */
.related-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.related-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.related-card:hover { border-color: var(--border2); background: var(--surface2); }
.related-sys-num { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; font-family: var(--font-mono); }
.related-sys-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.related-preload { font-size: 11px; color: var(--text2); line-height: 1.4; margin-bottom: 8px; }
.related-preload strong { color: var(--accent); font-weight: 500; }
.related-action {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  font-family: var(--font-mono);
}
.related-action::after { content: '→'; }

/* ── Divider ── */
.divider { height: 0.5px; background: var(--border); margin: 16px 0; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

/* ── Mobile responsive ── */
@media (max-width: 640px) {

  body { font-size: 16px; }

  .app-shell { padding: 0 16px 100px; }

  /* Header */
  .site-header { padding: 20px 0 18px; margin-bottom: 24px; }
  .logo-name { font-size: 17px; }
  .logo-mark { width: 30px; height: 30px; font-size: 14px; }
  .header-right { font-size: 11px; }

  /* Selector */
  .sel-intro { margin-bottom: 20px; }
  .sel-intro h1 { font-size: 26px; line-height: 1.15; }
  .sel-intro p { font-size: 15px; }
  .sys-grid { grid-template-columns: 1fr; gap: 8px; }
  .sys-card { padding: 14px 16px; }
  .sys-num { font-size: 11px; }
  .sys-name { font-size: 15px; }
  .sys-prob { font-size: 13px; }
  .sys-meta { font-size: 12px; }

  /* Runner header */
  .runner-top { flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .runner-info h2 { font-size: 19px; }
  .runner-info p { font-size: 13px; }
  .back-btn { align-self: flex-start; font-size: 13px; padding: 8px 14px; }

  /* Stepper — compact on mobile */
  .stepper { margin-bottom: 20px; gap: 0; }
  .step-pip { width: 26px; height: 26px; font-size: 10px; }
  .step-gem-label { font-size: 8px; }
  .step-connector { min-width: 8px; }

  /* Step card */
  .step-header { padding: 16px 16px 14px; gap: 12px; }
  .gem-icon { width: 34px; height: 34px; font-size: 13px; border-radius: 7px; }
  .step-gem-name { font-size: 11px; }
  .step-title { font-size: 17px; }
  .step-desc { font-size: 14px; }
  .step-body { padding: 16px; }

  /* Section labels */
  .sec-label { font-size: 11px; margin-bottom: 10px; }

  /* Inputs checklist */
  .inp-row { padding: 10px 0; gap: 12px; }
  .chkbox { width: 20px; height: 20px; border-radius: 5px; font-size: 12px; flex-shrink: 0; }
  .inp-txt { font-size: 15px; line-height: 1.5; }

  /* Checkpoint */
  .checkpoint { padding: 12px 14px; font-size: 14px; }

  /* Prompt */
  .prompt-box { font-size: 13px; line-height: 1.75; padding: 14px 14px 40px; }
  .copy-btn { top: auto; bottom: 10px; right: 10px; font-size: 12px; padding: 6px 12px; }

  /* Output */
  .output-note { font-size: 13px; padding: 10px 14px; }
  .output-textarea { font-size: 14px; min-height: 110px; padding: 12px 14px; }
  .save-note { font-size: 12px; }

  /* Nav buttons */
  .step-nav { gap: 8px; margin-top: 12px; }
  .nav-btn { padding: 13px 18px; font-size: 15px; flex: 1; text-align: center; }
  .step-counter { font-size: 13px; white-space: nowrap; flex-shrink: 0; }

  /* Completion */
  .complete-card { padding: 20px 16px; }
  .complete-icon { font-size: 26px; }
  .complete-title { font-size: 19px; }
  .complete-sub { font-size: 14px; }
  .kpi-grid { grid-template-columns: 1fr; gap: 8px; }
  .kpi-card { padding: 12px 14px; }
  .kpi-label { font-size: 11px; }
  .kpi-content { font-size: 13px; }

  /* Completion sections */
  .completion-section { margin-top: 16px; }

    steps:[

      {gem:"Kratos",title:"Propuesta única de valor como profesional",desc:"No 'soy coach certificado' — el resultado específico que produces, con métrica y tiempo.",inputs:["Buyer Persona de Aura","Objeciones principales","Tu mecanismo diferencial","Un resultado concreto con cliente real (con números)"],prompt:`Necesito construir mi PUV como profesional de servicios.\n\nBuyer Persona: [perfil de Aura]\nDolor más urgente: [dolor de Aura]\nMi mecanismo: [cómo lo hago yo]\nResultado real: [resultado + tiempo]\n\nFormato objetivo: "Ayudo a [perfil exacto] a [resultado con métrica] en [tiempo] mediante [mecanismo]". Sin jerga, sin "certificado", sin "apasionado". 3 variaciones.`,checkpoint:"¿Alguien externo entiende qué vendes y a quién en 5 segundos?",output_note:"Guarda el formato 'Ayudo a...' — es el eje de LinkedIn, la landing y la oferta."},
      {gem:"Alex",title:"Oferta de alto ticket",desc:"Estructura la oferta con resultado prometido, entregables, bonos, garantía y precio justificado.",inputs:["PUV de Kratos","Descripción detallada del servicio y entregables","Precio actual o precio objetivo","Garantía que estarías dispuesto a ofrecer"],prompt:`Necesito estructurar mi oferta de alto ticket.\n\nPUV: [PUV de Kratos]\nServicio: [descripción detallada]\nEntregables: [lista completa]\nPrecio objetivo: [precio]\n\nAplica el framework de Hormozi: resultado soñado, probabilidad de logro, reducción de tiempo y esfuerzo, bonos estratégicos y garantía. Justifica el precio con la ecuación de valor.`,output_note:"Guarda el stack completo y la garantía — los usa LandingPro."},

      {gem:"LandingPro",title:"Landing de captación de leads",desc:"Página enfocada en agendar llamadas de descubrimiento o descargar un lead magnet.",inputs:["Oferta Grand Slam de Alex","PUV de Kratos","Buyer Persona con objeciones de Aura","CTA objetivo: agendar llamada o lead magnet"],prompt:`Necesito la landing page para captar leads para mis servicios.\n\nPUV: [de Kratos]\nOferta: [de Alex]\nBuyer Persona: [de Aura]\nObjeciones principales: [de Aura]\nCTA objetivo: [agendar llamada / descargar lead magnet]\n\nCopy completo sección por sección. Espera mi validación antes de avanzar a cada sección.`,output_note:"Guarda el CTA exacto y la sección de beneficios — los usa VentasFlow."},
      {gem:"SalesSim",title:"Entrenamiento de cierre",desc:"Practica con clientes simulados: escéptico, indeciso y agresivo antes de la llamada real.",inputs:["Descripción del servicio y precio (de Alex)","Las 3 objeciones principales de Aura","Canal de venta: llamada o WhatsApp","Nivel de dificultad deseado"],prompt:`Quiero entrenar mi cierre de ventas para servicios de alto ticket.\n\nServicio: [nombre y precio de Alex]\nObjeciones más frecuentes: [de Aura]\nCanal: [llamada de Zoom / WhatsApp / DM LinkedIn]\nDificultad: [media / alta]\n\nSé el prospecto más escéptico posible. Simula objeciones reales de alto ticket. Al terminar, dame puntuación y áreas de mejora específicas.`,output_note:"Guarda las respuestas que funcionaron — las integra VentasFlow en los guiones de seguimiento."},

}
function saveState() {
  try { localStorage.setItem('gp_runner', JSON.stringify(state)); } catch(e) {}
}
function getSysState(id) {
  if (!state[id]) {
    const sys = SYSTEMS.find(s => s.id === id);
    state[id] = { step: 0, checks: sys.steps.map(s => new Array(s.inputs.length).fill(false)), outputs: new Array(sys.steps.length).fill('') };
  }
  return state[id];
}
function getSysProgress(id) {
  if (!state[id]) return 0;
  const s = state[id];
  const filledOutputs = s.outputs.filter(o => o && o.trim()).length;
  return Math.round((filledOutputs / SYSTEMS.find(x => x.id === id).steps.length) * 100);
}

// ── Selector ────────────────────────────────────────────
function buildSelector() {
  const grid = document.getElementById('sys-grid');
  grid.innerHTML = SYSTEMS.map(sys => {
    const prog = getSysProgress(sys.id);
    const hasProg = prog > 0;
    return `<div class="sys-card ${hasProg ? 'has-progress' : ''}" onclick="selectSystem(${sys.id})">
      <p class="sys-num">Sistema ${sys.id} ${hasProg ? '· ' + prog + '% completado' : ''}</p>
      <p class="sys-name">${sys.name}</p>
      <p class="sys-prob">${sys.problem}</p>
      <div class="sys-meta">
        <span>${sys.steps.length} etapas</span>
        <span>${sys.steps.map(s=>s.gem).slice(0,3).join(' · ')}${sys.steps.length > 3 ? '…' : ''}</span>
      </div>
      ${hasProg ? `<div class="sys-progress-bar"><div class="sys-progress-fill" style="width:${prog}%"></div></div>` : ''}
    </div>`;
  }).join('');
}

// ── Runner ──────────────────────────────────────────────
function selectSystem(id) {
  currentSys = SYSTEMS.find(s => s.id === id);
  const ss = getSysState(id);
  currentStep = ss.step;
  document.getElementById('screen-select').classList.remove('active');
  document.getElementById('screen-runner').classList.add('active');
  document.getElementById('rh-title').textContent = `Sistema ${currentSys.id} — ${currentSys.name}`;
  document.getElementById('rh-sub').textContent = currentSys.result;
  renderStep();
}

function goBack() {
  // Save current output before leaving
  saveCurrentOutput();
  document.getElementById('screen-runner').classList.remove('active');
  document.getElementById('screen-select').classList.add('active');
  buildSelector();
}

function saveCurrentOutput() {
  if (!currentSys) return;
  const ta = document.getElementById('output-ta');
  if (ta) {
    getSysState(currentSys.id).outputs[currentStep] = ta.value;
    saveState();
  }
}

function renderStep() {
  const steps = currentSys.steps;
  const s = steps[currentStep];
  const ss = getSysState(currentSys.id);
  const isLast = currentStep === steps.length - 1;

  // Stepper
  const stepperEl = document.getElementById('stepper');
  let stepperHTML = '';
  steps.forEach((st, i) => {
    const cls = i < currentStep ? 'done' : i === currentStep ? 'active' : '';
    stepperHTML += `<div class="step-pip-wrap ${cls}" onclick="jumpTo(${i})">
      <div class="step-pip">${i < currentStep ? '✓' : i + 1}</div>
      <div class="step-gem-label">${st.gem}</div>
    </div>`;
    if (i < steps.length - 1) {
      stepperHTML += `<div class="step-connector ${i < currentStep ? 'done' : ''}"></div>`;
    }
  });
  stepperEl.innerHTML = stepperHTML;
  // Scroll active pip into view
  setTimeout(() => {
    const active = stepperEl.querySelector('.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 50);

  // Gem initial
  const gemInitial = s.gem.substring(0, 2).toUpperCase();

  // Build step view
  let html = `<div class="step-card">
    <div class="step-header">
      <div class="gem-icon">${gemInitial}</div>
      <div class="step-header-text">
        <div class="step-gem-name">${s.gem}</div>
        <div class="step-title">${s.title}</div>
        <div class="step-desc">${s.desc}</div>
      </div>
    </div>
    <div class="step-body">
      <div class="sec-label">Información que necesitas antes de abrir el Gem</div>
      <div class="input-list">`;

  s.inputs.forEach((inp, idx) => {
    const done = ss.checks[currentStep][idx];
    html += `<div class="inp-row" onclick="toggleCheck(${idx})">
      <div class="chkbox ${done ? 'on' : ''}">${done ? '✓' : ''}</div>
      <span class="inp-txt ${done ? 'done' : ''}">${inp}</span>
    </div>`;
  });

  html += `</div>`;

  if (s.checkpoint) {
    html += `<div class="checkpoint"><span class="checkpoint-icon">⚠</span><span>Checkpoint — ${s.checkpoint}</span></div>`;
  }

  html += `<div class="sec-label">Prompt para este Gem</div>
    <div class="prompt-wrap">
      <div class="prompt-box">${fmtPrompt(s.prompt)}</div>
      <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">Copiar prompt</button>
    </div>
    <div class="sec-label">Qué guardar del output de ${s.gem}</div>
    <div class="output-note"><span class="output-note-icon">→</span><span>${s.output_note}</span></div>
    <div class="output-field-wrap">
      <textarea class="output-textarea ${ss.outputs[currentStep] ? 'has-content' : ''}" id="output-ta" placeholder="Pega aquí el output relevante de ${s.gem}…" oninput="onOutputChange(this)">${ss.outputs[currentStep] || ''}</textarea>
      <div class="save-note">Se guarda automáticamente · accesible en pasos siguientes</div>
    </div>`;

  html += `</div></div>`;

  // Completion screen on last step
  if (isLast && ss.outputs[currentStep]) {
    const related = getRelatedSystems(currentSys.id);
    const relatedHTML = related.length ? `
      <div class="completion-section">
        <div class="completion-section-title">Sistemas que se alimentan de este trabajo</div>
        <div class="related-grid">
          ${related.map(r => `
            <div class="related-card" onclick="goToRelated(${r.id})">
              <div class="related-sys-num">Sistema ${r.id}</div>
              <div class="related-sys-name">${r.name}</div>
              <div class="related-preload">${r.preloadNote}</div>
              <div class="related-action">Ir a este sistema</div>
            </div>
          `).join('')}
        </div>
      </div>` : '';

    html += `<div class="complete-wrap">
      <div class="complete-card">
        <div class="complete-icon">✦</div>
        <div class="complete-title">Sistema ${currentSys.id} completado</div>
        <div class="complete-sub">${currentSys.result}</div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">KPIs cuantitativos</div><div class="kpi-content">${currentSys.kpis.q}</div></div>
        <div class="kpi-card"><div class="kpi-label">KPIs cualitativos</div><div class="kpi-content">${currentSys.kpis.c}</div></div>
      </div>

      <div class="completion-section">
        <div class="completion-section-title">Exportar brief de trabajo</div>
        <button class="export-btn" onclick="exportBrief()">
          <span class="export-icon">↓</span>
          Descargar brief completo del Sistema ${currentSys.id}
        </button>
        <div class="export-hint">Documento con todos los outputs guardados por etapa</div>
      </div>

      ${relatedHTML}

      <div class="completion-section" style="text-align:center">
        <button class="restart-btn" onclick="resetSystem()">↺ Reiniciar sistema ${currentSys.id}</button>
      </div>
    </div>`;
  }

  document.getElementById('step-view').innerHTML = html;
  document.getElementById('step-counter').textContent = `${currentStep + 1} / ${steps.length}`;
  document.getElementById('btn-prev').disabled = currentStep === 0;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = isLast;
  nextBtn.textContent = isLast ? 'Completado ✓' : 'Siguiente →';
}

function fmtPrompt(text) {
  return text.replace(/\[([^\]]+)\]/g, '<span class="prompt-var">[$1]</span>');
}

function toggleCheck(idx) {
  const ss = getSysState(currentSys.id);
  ss.checks[currentStep][idx] = !ss.checks[currentStep][idx];
  saveState();
  renderStep();
}

function onOutputChange(el) {
  const ss = getSysState(currentSys.id);
  ss.outputs[currentStep] = el.value;
  el.classList.toggle('has-content', !!el.value.trim());
  ss.step = currentStep;
  saveState();
}

function nav(dir) {
  saveCurrentOutput();
  const max = currentSys.steps.length - 1;
  if (currentStep + dir < 0 || currentStep + dir > max) return;
  currentStep += dir;
  getSysState(currentSys.id).step = currentStep;
  saveState();
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpTo(i) {
  saveCurrentOutput();
  currentStep = i;
  getSysState(currentSys.id).step = i;
  saveState();
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyPrompt() {
  const text = currentSys.steps[currentStep].prompt;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    if (!btn) return;
    btn.textContent = '✓ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar prompt'; btn.classList.remove('copied'); }, 1800);
  });
}

function resetSystem() {
  if (!confirm(`¿Reiniciar el progreso del Sistema ${currentSys.id}? Se perderán todos los outputs guardados.`)) return;
  delete state[currentSys.id];
  saveState();
  currentStep = 0;
  renderStep();
}

function getRelatedSystems(sysId) {
  return (CONNECTIONS[sysId] || []).map(r => ({
    ...r,
    sys: SYSTEMS.find(s => s.id === r.id)
  }));
}

function goToRelated(toSysId) {
  const fromSysId = currentSys.id;
  saveCurrentOutput();

  // Apply preloads as suggestions
  const preloadMap = PRELOADS[fromSysId] && PRELOADS[fromSysId][toSysId];
  if (preloadMap) {
    const fromSS = getSysState(fromSysId);
    const toSS = getSysState(toSysId);
    preloadMap.forEach(p => {
      const fromOutput = fromSS.outputs[p.fromStep];
      if (fromOutput && fromOutput.trim()) {
        const existing = toSS.outputs[p.toStep];
        const separator = existing && existing.trim() ? '\n\n---\n' : '';
        const suggestion = `${separator}[Sugerencia desde S${fromSysId} — ${p.hint}]\n${fromOutput}`;
        if (!existing || !existing.includes(`S${fromSysId}`)) {
          toSS.outputs[p.toStep] = existing ? existing + suggestion : suggestion;
        }
      }
    });
    saveState();
  }

  selectSystem(toSysId);
}

// ── Export brief ─────────────────────────────────────────
function exportBrief() {
  const ss = getSysState(currentSys.id);
  const steps = currentSys.steps;
  const date = new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric' });

  let content = `GEMS PACK — BRIEF DE TRABAJO\n`;
  content += `${'═'.repeat(50)}\n`;
  content += `Sistema ${currentSys.id}: ${currentSys.name}\n`;
  content += `Fecha: ${date}\n`;
  content += `${'═'.repeat(50)}\n\n`;
  content += `RESULTADO ESPERADO\n${'-'.repeat(30)}\n${currentSys.result}\n\n`;
  content += `KPIs CUANTITATIVOS\n${'-'.repeat(30)}\n${currentSys.kpis.q}\n\n`;
  content += `KPIs CUALITATIVOS\n${'-'.repeat(30)}\n${currentSys.kpis.c}\n\n`;
  content += `${'═'.repeat(50)}\nOUTPUTS POR ETAPA\n${'═'.repeat(50)}\n\n`;

  steps.forEach((s, i) => {
    const output = ss.outputs[i];
    const checksDone = ss.checks[i].filter(Boolean).length;
    const checksTotal = ss.checks[i].length;
    content += `ETAPA ${i + 1}: ${s.title.toUpperCase()} (${s.gem})\n`;
    content += `${'-'.repeat(40)}\n`;
    content += `Inputs revisados: ${checksDone}/${checksTotal}\n`;
    if (output && output.trim()) {
      content += `\nOutput guardado:\n${output}\n`;
    } else {
      content += `\nOutput guardado: [pendiente]\n`;
    }
    content += `\n`;
  });

  content += `${'═'.repeat(50)}\n`;
  content += `Generado con Gems Pack System Runner\n`;
  content += `rodolfobuitrago.com\n`;

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gems-brief-sistema-${currentSys.id}-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
