<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gems Pack — System Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b14;
  --surface: #0f1629;
  --surface2: #1e2d4a;
  --surface3: #243354;
  --border: rgba(43,212,184,0.1);
  --border2: rgba(43,212,184,0.22);
  --text: #e8f4f2;
  --text2: #8fb8b3;
  --text3: #4a7a75;
  --accent: #2bd4b8;
  --accent2: #22b09a;
  --accent-purple: #a78bfa;
  --accent-amber: #f59e0b;
  --success: #2bd4b8;
  --success-bg: rgba(43,212,184,0.08);
  --warn: #f59e0b;
  --warn-bg: rgba(245,158,11,0.1);
  --info: #a78bfa;
  --info-bg: rgba(167,139,250,0.1);
  --font-display: 'Sora', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  /* Fluid type scale — clamp(min, preferred, max) */
  --text-xs:   clamp(11px, 1.8vw, 12px);
  --text-sm:   clamp(13px, 2.2vw, 14px);
  --text-base: clamp(15px, 2.5vw, 16px);
  --text-md:   clamp(16px, 2.8vw, 18px);
  --text-lg:   clamp(18px, 3.2vw, 22px);
  --text-xl:   clamp(22px, 4vw,   28px);
  --text-2xl:  clamp(26px, 5vw,   36px);
  --radius: 10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.65;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.app-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ── Header ── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 24px;
  border-bottom: 0.5px solid rgba(43,212,184,0.15);
  margin-bottom: 32px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #2bd4b8, #a78bfa);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-base);
  flex-shrink: 0;
}
.logo-name {
  font-family: var(--font-display);
  font-size: var(--text-md);
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.03em;
}
.logo-sub {
  font-size: var(--text-xs);
  color: var(--accent);
  opacity: 0.7;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
}
.header-right {
  font-size: var(--text-xs);
  color: var(--text3);
}

/* ── Screen transitions ── */
.screen { display: none; animation: fadeIn 0.2s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── Selector screen ── */
.sel-intro { margin-bottom: 28px; }
.sel-intro h1 {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text);
  line-height: 1.15;
  margin-bottom: 10px;
}
.sel-intro h1 em {
  font-style: italic;
  background: linear-gradient(90deg, #2bd4b8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sel-intro p { color: var(--text2); font-size: var(--text-base); font-weight: 400; line-height: 1.6; }

.sys-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}

.sys-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.sys-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #2bd4b8, #a78bfa);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s ease;
}
.sys-card:hover { border-color: rgba(43,212,184,0.3); background: var(--surface2); transform: translateY(-1px); box-shadow: 0 4px 24px rgba(43,212,184,0.06); }
.sys-card:hover::before { transform: scaleX(1); }
.sys-card.has-progress::before { transform: scaleX(1); background: linear-gradient(90deg, var(--accent), var(--accent-purple)); }

.sys-num {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 5px;
  font-family: var(--font-mono);
}
.sys-card.has-progress .sys-num { color: var(--success); }
.sys-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.sys-prob {
  font-size: var(--text-sm);
  color: var(--text2);
  line-height: 1.5;
  margin-bottom: 10px;
}
.sys-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text3);
}
.sys-progress-bar {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 10px;
  overflow: hidden;
}
.sys-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-purple));
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* ── Runner screen ── */
.runner-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.runner-info h2 {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 4px;
  background: linear-gradient(90deg, var(--text) 60%, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.runner-info p { font-size: var(--text-sm); color: var(--text2); font-weight: 400; }

.back-btn {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 16px;
  font-size: var(--text-sm);
  font-weight: 500;
  font-family: var(--font-body);
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}
.back-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── Progress stepper ── */
.stepper {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 28px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.stepper::-webkit-scrollbar { display: none; }

.step-pip-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
}
.step-pip {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-xs);
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text3);
  transition: all 0.2s;
  position: relative;
  z-index: 1;
}
.step-pip-wrap.done .step-pip { background: rgba(43,212,184,0.1); border-color: var(--accent); color: var(--accent); }
.step-pip-wrap.active .step-pip { background: var(--accent); border-color: var(--accent); color: #080b14; font-weight: 700; }
.step-pip-wrap .step-gem-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text3);
  margin-top: 4px;
  white-space: nowrap;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
  transition: color 0.2s;
}
.step-pip-wrap.active .step-gem-label { color: var(--accent); }
.step-pip-wrap.done .step-gem-label { color: var(--accent); }

.step-connector {
  height: 1.5px;
  flex: 1;
  min-width: 12px;
  background: var(--border);
  margin-bottom: 18px;
  flex-shrink: 0;
}
.step-connector.done { background: var(--accent); opacity: 0.4; }

/* ── Step card ── */
.step-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}

.step-header {
  padding: 18px 20px 16px;
  border-bottom: 0.5px solid var(--border);
  border-left: 3px solid var(--accent);
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.gem-icon {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--accent), var(--accent-purple));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-sm);
  flex-shrink: 0;
  color: #0e0e0f;
  font-weight: 700;
  font-family: var(--font-mono);
}
.step-header-text { flex: 1; }
.step-gem-name {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-purple);
  margin-bottom: 4px;
  font-family: var(--font-mono);
}
.step-title {
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.step-desc { font-size: var(--text-sm); color: var(--text2); line-height: 1.55; font-weight: 400; }

.step-body { padding: 18px 20px; }

/* ── Section labels ── */
.sec-label {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sec-label::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 10px;
  background: linear-gradient(180deg, var(--accent), var(--accent-purple));
  border-radius: 2px;
  opacity: 0.8;
}

/* ── Inputs checklist ── */
.input-list { margin-bottom: 16px; }
.inp-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 0;
  cursor: pointer;
  border-bottom: 0.5px solid var(--border);
}
.inp-row:last-child { border-bottom: none; }
.inp-row:hover .inp-txt { color: var(--text); }

.chkbox {
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--text3);
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: var(--text-xs);
}
.chkbox.on { background: var(--accent); border-color: var(--accent); color: #080b14; }
.inp-txt { font-size: var(--text-base); color: var(--text2); line-height: 1.55; font-weight: 400; transition: color 0.15s; }
.inp-txt.done { text-decoration: line-through; opacity: 0.4; }

/* ── Checkpoint ── */
.checkpoint {
  background: var(--warn-bg);
  border: 0.5px solid rgba(245,158,11,0.25);
  border-left: 3px solid var(--warn);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--warn);
  line-height: 1.55;
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.checkpoint-icon { flex-shrink: 0; font-size: var(--text-sm); }

/* ── Prompt ── */
.prompt-wrap {
  position: relative;
  margin-bottom: 16px;
}
.prompt-box {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 16px 48px;
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text2);
  line-height: 1.85;
  white-space: pre-wrap;
  word-break: break-word;
}
.prompt-var { color: var(--accent); font-weight: 500; }
.copy-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: var(--surface3);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-size: var(--text-xs);
  font-weight: 600;
  font-family: var(--font-body);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.copy-btn:hover { color: var(--text); border-color: var(--accent); }
.copy-btn.copied { color: var(--success); border-color: var(--success); }

/* ── Output note ── */
.output-note {
  background: rgba(43,212,184,0.06);
  border: 0.5px solid rgba(43,212,184,0.2);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--accent);
  line-height: 1.6;
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.output-note-icon { flex-shrink: 0; }

/* ── Output field ── */
.output-field-wrap { margin-top: 4px; }
.output-textarea {
  width: 100%;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text);
  line-height: 1.75;
  resize: vertical;
  min-height: 100px;
  transition: border-color 0.15s;
  outline: none;
}
.output-textarea::placeholder { color: var(--text3); }
.output-textarea:focus { border-color: var(--border2); }
.output-textarea.has-content { border-color: rgba(43,212,184,0.35); }

.save-note {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text3);
  margin-top: 6px;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}

/* ── Nav ── */
.step-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 8px;
}
.nav-btn {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 22px;
  font-size: var(--text-sm);
  font-family: var(--font-body);
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.nav-btn:hover:not(:disabled) { border-color: var(--border2); color: var(--text); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-purple));
  border-color: transparent;
  color: #080b14;
  font-weight: 600;
}
.nav-btn.primary:hover:not(:disabled) { opacity: 0.88; }
.step-counter {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text3);
  font-family: var(--font-mono);
  white-space: nowrap;
}

/* ── Complete card ── */
.complete-wrap {
  margin-top: 4px;
}
.complete-card {
  background: linear-gradient(135deg, rgba(43,212,184,0.07), rgba(167,139,250,0.07));
  border: 0.5px solid rgba(43,212,184,0.2);
  border-radius: var(--radius);
  padding: 20px 24px;
  text-align: center;
  margin-bottom: 16px;
}
.complete-icon { font-size: var(--text-2xl); margin-bottom: 8px; }
.complete-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--accent);
  margin-bottom: 6px;
}
.complete-sub { font-size: var(--text-base); font-weight: 400; color: var(--text2); line-height: 1.55; }

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.kpi-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-left: 2px solid var(--accent-purple);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.kpi-label {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
  font-family: var(--font-mono);
}
.kpi-content { font-size: var(--text-sm); font-weight: 400; color: var(--text2); line-height: 1.6; }

.restart-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 22px;
  font-size: var(--text-sm);
  font-weight: 500;
  font-family: var(--font-body);
  color: var(--text2);
  cursor: pointer;
  margin: 0 auto;
  transition: all 0.15s;
}
.restart-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── Completion screen extras ── */
.completion-section { margin-top: 20px; }
.completion-section-title {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 6px;
}
.completion-section-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 10px;
  background: linear-gradient(180deg, var(--accent), var(--accent-purple));
  border-radius: 2px;
  opacity: 0.8;
}

/* Export brief */
.export-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--surface2);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  padding: 16px 20px;
  font-size: var(--text-base);
  font-family: var(--font-body);
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
}
.export-btn:hover { border-color: var(--accent); background: var(--surface2); box-shadow: 0 0 0 1px rgba(43,212,184,0.15); }
.export-btn .export-icon { font-size: var(--text-base); opacity: 0.7; }
.export-hint { font-size: var(--text-xs); font-weight: 500; color: var(--text3); text-align: center; font-family: var(--font-mono); }

/* Related systems */
.related-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.related-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.related-card:hover { border-color: var(--border2); background: var(--surface2); }
.related-sys-num { font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; font-family: var(--font-mono); }
.related-sys-name { font-size: var(--text-sm); font-weight: 600; letter-spacing: -0.01em; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.related-preload { font-size: var(--text-sm); color: var(--text2); line-height: 1.5; margin-bottom: 8px; }
.related-preload strong { color: var(--accent); font-weight: 500; }
.related-action {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--accent-purple);
  font-family: var(--font-mono);
}
.related-action::after { content: '→'; }

/* ── Divider ── */
.divider { height: 0.5px; background: var(--border); margin: 16px 0; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

/* ── Mobile responsive ── */
@media (max-width: 640px) {

  /* ── Layout adjustments only — typography scales via clamp() ── */

  .app-shell { padding: 0 16px 100px; }

  .site-header { padding: 18px 0 16px; margin-bottom: 20px; }
  .logo-mark { width: 28px; height: 28px; }

  .sel-intro { margin-bottom: 18px; }

// ── State ──────────────────────────────────────────────
let currentSys = null;
let currentStep = 0;
let state = {}; // { sysId: { step, checks: [[bool]], outputs: [string] } }

function loadState() {
  try { state = JSON.parse(localStorage.getItem('gp_runner') || '{}'); } catch(e) { state = {}; }
}
function saveState() {
  try { localStorage.setItem('gp_runner', JSON.stringify(state)); } catch(e) {}
}
function getSysState(id) {
  if (!state[id]) {
    const sys = SYSTEMS.find(s => s.id === id);
    state[id] = { step: 0, checks: sys.steps.map(s => new Array(s.inputs.length).fill(false)), outputs: new Array(sys.steps.length).fill('') };
  }
  return state[id];
}
function getSysProgress(id) {
  if (!state[id]) return 0;
  const s = state[id];
  const filledOutputs = s.outputs.filter(o => o && o.trim()).length;
  return Math.round((filledOutputs / SYSTEMS.find(x => x.id === id).steps.length) * 100);
}

// ── Selector ────────────────────────────────────────────
function buildSelector() {
  const grid = document.getElementById('sys-grid');
  grid.innerHTML = SYSTEMS.map(sys => {
    const prog = getSysProgress(sys.id);
    const hasProg = prog > 0;
    return `<div class="sys-card ${hasProg ? 'has-progress' : ''}" onclick="selectSystem(${sys.id})">
      <p class="sys-num">Sistema ${sys.id} ${hasProg ? '· ' + prog + '% completado' : ''}</p>
      <p class="sys-name">${sys.name}</p>
      <p class="sys-prob">${sys.problem}</p>
      <div class="sys-meta">
        <span>${sys.steps.length} etapas</span>
        <span>${sys.steps.map(s=>s.gem).slice(0,3).join(' · ')}${sys.steps.length > 3 ? '…' : ''}</span>
      </div>
      ${hasProg ? `<div class="sys-progress-bar"><div class="sys-progress-fill" style="width:${prog}%"></div></div>` : ''}
    </div>`;
  }).join('');
}

// ── Runner ──────────────────────────────────────────────
function selectSystem(id) {
  currentSys = SYSTEMS.find(s => s.id === id);
  const ss = getSysState(id);
  currentStep = ss.step;
  document.getElementById('screen-select').classList.remove('active');
  document.getElementById('screen-runner').classList.add('active');
  document.getElementById('rh-title').textContent = `Sistema ${currentSys.id} — ${currentSys.name}`;
  document.getElementById('rh-sub').textContent = currentSys.result;
  renderStep();
}

function goBack() {
  // Save current output before leaving
  saveCurrentOutput();
  document.getElementById('screen-runner').classList.remove('active');
  document.getElementById('screen-select').classList.add('active');
  buildSelector();
}

function saveCurrentOutput() {
  if (!currentSys) return;
  const ta = document.getElementById('output-ta');
  if (ta) {
    getSysState(currentSys.id).outputs[currentStep] = ta.value;
    saveState();
  }
}

function renderStep() {
  const steps = currentSys.steps;
  const s = steps[currentStep];
  const ss = getSysState(currentSys.id);
  const isLast = currentStep === steps.length - 1;

  // Stepper
  const stepperEl = document.getElementById('stepper');
  let stepperHTML = '';
  steps.forEach((st, i) => {
    const cls = i < currentStep ? 'done' : i === currentStep ? 'active' : '';
    stepperHTML += `<div class="step-pip-wrap ${cls}" onclick="jumpTo(${i})">
      <div class="step-pip">${i < currentStep ? '✓' : i + 1}</div>
      <div class="step-gem-label">${st.gem}</div>
    </div>`;
    if (i < steps.length - 1) {
      stepperHTML += `<div class="step-connector ${i < currentStep ? 'done' : ''}"></div>`;
    }
  });
  stepperEl.innerHTML = stepperHTML;
  // Scroll active pip into view
  setTimeout(() => {
    const active = stepperEl.querySelector('.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 50);

  // Gem initial
  const gemInitial = s.gem.substring(0, 2).toUpperCase();

  // Build step view
  let html = `<div class="step-card">
    <div class="step-header">
      <div class="gem-icon">${gemInitial}</div>
      <div class="step-header-text">
        <div class="step-gem-name">${s.gem}</div>
        <div class="step-title">${s.title}</div>
        <div class="step-desc">${s.desc}</div>
      </div>
    </div>
    <div class="step-body">
      <div class="sec-label">Información que necesitas antes de abrir el Gem</div>
      <div class="input-list">`;

  s.inputs.forEach((inp, idx) => {
    const done = ss.checks[currentStep][idx];
    html += `<div class="inp-row" onclick="toggleCheck(${idx})">
      <div class="chkbox ${done ? 'on' : ''}">${done ? '✓' : ''}</div>
      <span class="inp-txt ${done ? 'done' : ''}">${inp}</span>
    </div>`;
  });

  html += `</div>`;

  if (s.checkpoint) {
    html += `<div class="checkpoint"><span class="checkpoint-icon">⚠</span><span>Checkpoint — ${s.checkpoint}</span></div>`;
  }

  html += `<div class="sec-label">Prompt para este Gem</div>
    <div class="prompt-wrap">
      <div class="prompt-box">${fmtPrompt(s.prompt)}</div>
      <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">Copiar prompt</button>
    </div>
    <div class="sec-label">Qué guardar del output de ${s.gem}</div>
    <div class="output-note"><span class="output-note-icon">→</span><span>${s.output_note}</span></div>
    <div class="output-field-wrap">
      <textarea class="output-textarea ${ss.outputs[currentStep] ? 'has-content' : ''}" id="output-ta" placeholder="Pega aquí el output relevante de ${s.gem}…" oninput="onOutputChange(this)">${ss.outputs[currentStep] || ''}</textarea>
      <div class="save-note">Se guarda automáticamente · accesible en pasos siguientes</div>
    </div>`;

  html += `</div></div>`;

  // Completion screen on last step
  if (isLast) {
    const related = getRelatedSystems(currentSys.id);
    const relatedHTML = related.length ? `
      <div class="completion-section">
        <div class="completion-section-title">Sistemas que se alimentan de este trabajo</div>
        <div class="related-grid">
          ${related.map(r => `
            <div class="related-card" onclick="goToRelated(${r.id})">
              <div class="related-sys-num">Sistema ${r.id}</div>
              <div class="related-sys-name">${r.name}</div>
              <div class="related-preload">${r.preloadNote}</div>
              <div class="related-action">Ir a este sistema</div>
            </div>
          `).join('')}
        </div>
      </div>` : '';

    html += `<div class="complete-wrap" id="complete-wrap">
      <div class="complete-card">
        <div class="complete-icon">✦</div>
        <div class="complete-title">Sistema ${currentSys.id} completado</div>
        <div class="complete-sub">${currentSys.result}</div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">KPIs cuantitativos</div><div class="kpi-content">${currentSys.kpis.q}</div></div>
        <div class="kpi-card"><div class="kpi-label">KPIs cualitativos</div><div class="kpi-content">${currentSys.kpis.c}</div></div>
      </div>

      <div class="completion-section">
        <div class="completion-section-title">Exportar brief de trabajo</div>
        <button class="export-btn" onclick="exportBrief()">
          <span class="export-icon">↓</span>
          Descargar brief completo del Sistema ${currentSys.id}
        </button>
        <div class="export-hint">Documento con todos los outputs guardados por etapa</div>
      </div>

      ${relatedHTML}

      <div class="completion-section" style="text-align:center">
        <button class="restart-btn" onclick="resetSystem()">↺ Reiniciar sistema ${currentSys.id}</button>
      </div>
    </div>`;
  }

  document.getElementById('step-view').innerHTML = html;
  document.getElementById('step-counter').textContent = `${currentStep + 1} / ${steps.length}`;
  document.getElementById('btn-prev').disabled = currentStep === 0;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = isLast;
  nextBtn.textContent = isLast ? 'Ver resultados ↓' : 'Siguiente →';

  // On last step, scroll to completion section after a short delay
  if (isLast) {
    setTimeout(() => {
      const cw = document.getElementById('complete-wrap');
      if (cw) cw.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);
  }
}

function fmtPrompt(text) {
  return text.replace(/\[([^\]]+)\]/g, '<span class="prompt-var">[$1]</span>');
}

function toggleCheck(idx) {
  const ss = getSysState(currentSys.id);
  ss.checks[currentStep][idx] = !ss.checks[currentStep][idx];
  saveState();
  renderStep();
}

function onOutputChange(el) {
  const ss = getSysState(currentSys.id);
  ss.outputs[currentStep] = el.value;
  el.classList.toggle('has-content', !!el.value.trim());
  ss.step = currentStep;
  saveState();
}

function nav(dir) {
  saveCurrentOutput();
  const max = currentSys.steps.length - 1;
  if (currentStep + dir < 0 || currentStep + dir > max) return;
  currentStep += dir;
  getSysState(currentSys.id).step = currentStep;
  saveState();
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpTo(i) {
  saveCurrentOutput();
  currentStep = i;
  getSysState(currentSys.id).step = i;
  saveState();
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyPrompt() {
  const text = currentSys.steps[currentStep].prompt;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    if (!btn) return;
    btn.textContent = '✓ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar prompt'; btn.classList.remove('copied'); }, 1800);
  });
}

function resetSystem() {
  if (!confirm(`¿Reiniciar el progreso del Sistema ${currentSys.id}? Se perderán todos los outputs guardados.`)) return;
  delete state[currentSys.id];
  saveState();
  currentStep = 0;
  renderStep();
}

};

function getRelatedSystems(sysId) {
  return (CONNECTIONS[sysId] || []).map(r => ({
    ...r,
    sys: SYSTEMS.find(s => s.id === r.id)
  }));
}

function goToRelated(toSysId) {
  const fromSysId = currentSys.id;
  saveCurrentOutput();

  // Apply preloads as suggestions
  const preloadMap = PRELOADS[fromSysId] && PRELOADS[fromSysId][toSysId];
  if (preloadMap) {
    const fromSS = getSysState(fromSysId);
    const toSS = getSysState(toSysId);
    preloadMap.forEach(p => {
      const fromOutput = fromSS.outputs[p.fromStep];
      if (fromOutput && fromOutput.trim()) {
        const existing = toSS.outputs[p.toStep];
        const separator = existing && existing.trim() ? '\n\n---\n' : '';
        const suggestion = `${separator}[Sugerencia desde S${fromSysId} — ${p.hint}]\n${fromOutput}`;
        if (!existing || !existing.includes(`S${fromSysId}`)) {
          toSS.outputs[p.toStep] = existing ? existing + suggestion : suggestion;
        }
      }
    });
    saveState();
  }

  selectSystem(toSysId);
}

// ── Export brief ─────────────────────────────────────────
function exportBrief() {
  const ss = getSysState(currentSys.id);
  const steps = currentSys.steps;
  const date = new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric' });

  let content = `GEMS PACK — BRIEF DE TRABAJO\n`;
  content += `${'═'.repeat(50)}\n`;
  content += `Sistema ${currentSys.id}: ${currentSys.name}\n`;
  content += `Fecha: ${date}\n`;
  content += `${'═'.repeat(50)}\n\n`;
  content += `RESULTADO ESPERADO\n${'-'.repeat(30)}\n${currentSys.result}\n\n`;
  content += `KPIs CUANTITATIVOS\n${'-'.repeat(30)}\n${currentSys.kpis.q}\n\n`;
  content += `KPIs CUALITATIVOS\n${'-'.repeat(30)}\n${currentSys.kpis.c}\n\n`;
  content += `${'═'.repeat(50)}\nOUTPUTS POR ETAPA\n${'═'.repeat(50)}\n\n`;

  steps.forEach((s, i) => {
    const output = ss.outputs[i];
    const checksDone = ss.checks[i].filter(Boolean).length;
    const checksTotal = ss.checks[i].length;
    content += `ETAPA ${i + 1}: ${s.title.toUpperCase()} (${s.gem})\n`;
    content += `${'-'.repeat(40)}\n`;
    content += `Inputs revisados: ${checksDone}/${checksTotal}\n`;
    if (output && output.trim()) {
      content += `\nOutput guardado:\n${output}\n`;
    } else {
      content += `\nOutput guardado: [pendiente]\n`;
    }
    content += `\n`;
  });

  content += `${'═'.repeat(50)}\n`;
  content += `Generado con Gems Pack System Runner\n`;
  content += `rodolfobuitrago.com\n`;

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gems-brief-sistema-${currentSys.id}-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
